<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droply — Share Instantly</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(40px);
            animation: float 8s ease-in-out infinite;
        }

        .blob1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob2 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            top: 50%;
            right: -50px;
            animation-delay: 2s;
        }

        .blob3 {
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            bottom: -100px;
            left: 50%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Cards and Sections */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Buttons */
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(245, 87, 108, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(79, 172, 254, 0.6);
        }

        /* Input Fields */
        input, textarea, select {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        /* Text Colors */
        h1, h2, h3 {
            color: white;
            font-weight: 700;
        }

        p {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Grid Layout */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 25px;
            }
        }

        /* Upload Area */
        .upload-zone {
            border: 3px dashed rgba(102, 126, 234, 0.5);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-zone:hover {
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }

        .upload-zone.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            transform: scale(1.05);
        }

        /* File List */
        .file-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideInLeft 0.4s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        /* Message Box */
        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin: 15px 0;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #a7f3d0;
        }

        .message-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        /* Progress Bar */
        .progress {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        /* Icon Animations */
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Success Animation */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .success-animation {
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Section Transitions */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-out {
            animation: fadeOut 0.3s ease-out;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Container */
        .container-max {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Feature Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .feature-box:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .feature-box .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature-box h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #a7f3d0;
        }

        /* Back Button */
        .back-btn {
            display: inline-block;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            color: white;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useRef } = React;
        const e = React.createElement;

        function App() {
            const [view, setView] = useState('home');
            const [userCode, setUserCode] = useState('');
            const [accessCode, setAccessCode] = useState('');
            const [files, setFiles] = useState([]);
            const [text, setText] = useState('');
            const [expiresIn, setExpiresIn] = useState('3600');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');
            const [uploadProgress, setUploadProgress] = useState(0);
            const [accessedDrop, setAccessedDrop] = useState(null);
            const fileInputRef = useRef(null);
            const [dragOver, setDragOver] = useState(false);

            const API_URL = 'http://localhost:4000/api/v1';

            // HOME SCREEN
            const renderHome = () => e('div', { className: 'main-content' },
                e('div', { className: 'animated-bg' },
                    e('div', { className: 'blob blob1' }),
                    e('div', { className: 'blob blob2' }),
                    e('div', { className: 'blob blob3' })
                ),
                e('div', { className: 'container-max fade-in' },
                    e('div', { className: 'text-center mb-12' },
                        e('div', { className: 'icon' }, '📦'),
                        e('h1', { className: 'text-6xl font-bold mb-4' }, 'Droply'),
                        e('p', { className: 'text-2xl text-white/70 mb-8' }, 'Share files & messages instantly'),
                        e('p', { className: 'text-lg text-white/50 mb-12' }, 'No account. No limits. Just secure sharing.')
                    ),

                    e('div', { className: 'grid-2 mb-8' },
                        e('div', { className: 'card text-center p-12 cursor-pointer', onClick: () => setView('setcode') },
                            e('div', { className: 'icon' }, '🚀'),
                            e('h3', { className: 'text-2xl font-bold mb-3' }, 'Create Drop'),
                            e('p', { className: 'text-white/60' }, 'Upload files or add text')
                        ),
                        e('div', { className: 'card text-center p-12 cursor-pointer', onClick: () => setView('access') },
                            e('div', { className: 'icon' }, '📥'),
                            e('h3', { className: 'text-2xl font-bold mb-3' }, 'Access Drop'),
                            e('p', { className: 'text-white/60' }, 'Download with secret code')
                        )
                    ),

                    e('div', { className: 'features-grid' },
                        e('div', { className: 'feature-box' },
                            e('div', { className: 'icon' }, '🔒'),
                            e('h3', {}, 'Secure'),
                            e('p', { className: 'text-white/50 text-sm' }, 'Secret codes protect your drops')
                        ),
                        e('div', { className: 'feature-box' },
                            e('div', { className: 'icon' }, '⏰'),
                            e('h3', {}, 'Temporary'),
                            e('p', { className: 'text-white/50 text-sm' }, 'Auto-deletes after expiry')
                        ),
                        e('div', { className: 'feature-box' },
                            e('div', { className: 'icon' }, '📁'),
                            e('h3', {}, 'Any File'),
                            e('p', { className: 'text-white/50 text-sm' }, 'All file types supported')
                        )
                    )
                )
            );

            // SET CODE
            const renderSetCode = () => e('div', { className: 'main-content' },
                e('div', { className: 'animated-bg' },
                    e('div', { className: 'blob blob1' }),
                    e('div', { className: 'blob blob2' }),
                    e('div', { className: 'blob blob3' })
                ),
                e('div', { className: 'container-max fade-in' },
                    e('a', { className: 'back-btn', onClick: () => setView('home') }, '← Back Home'),
                    e('div', { className: 'card max-w-md mx-auto' },
                        e('div', { className: 'icon text-center' }, '🔐'),
                        e('h2', { className: 'text-3xl font-bold text-center mb-2' }, 'Set Your Code'),
                        e('p', { className: 'text-center text-white/60 mb-8' }, 'Choose a secret code'),

                        message && e('div', { className: `message ${message.includes('✅') ? 'message-success' : 'message-error'}` }, message),

                        e('input', {
                            type: 'text',
                            value: userCode,
                            onChange: (evt) => setUserCode(evt.target.value),
                            placeholder: 'Enter secret code',
                            className: 'w-full p-4 mb-6'
                        }),

                        e('button', {
                            onClick: () => {
                                if (!userCode.trim()) {
                                    setMessage('❌ Enter a code');
                                    return;
                                }
                                if (userCode.length < 4) {
                                    setMessage('❌ Code must be 4+ characters');
                                    return;
                                }
                                setMessage('');
                                setView('create');
                            },
                            className: 'btn btn-primary w-full mb-3'
                        }, 'Continue'),

                        e('button', {
                            onClick: () => setView('home'),
                            className: 'btn w-full bg-white/10 hover:bg-white/20 text-white'
                        }, 'Cancel')
                    )
                )
            );

            // ACCESS DROP
            const renderAccess = () => e('div', { className: 'main-content' },
                e('div', { className: 'animated-bg' },
                    e('div', { className: 'blob blob1' }),
                    e('div', { className: 'blob blob2' }),
                    e('div', { className: 'blob blob3' })
                ),
                e('div', { className: 'container-max fade-in' },
                    e('a', { className: 'back-btn', onClick: () => setView('home') }, '← Back Home'),
                    e('div', { className: 'card max-w-md mx-auto' },
                        e('div', { className: 'icon text-center' }, '🔓'),
                        e('h2', { className: 'text-3xl font-bold text-center mb-2' }, 'Access Drop'),
                        e('p', { className: 'text-center text-white/60 mb-8' }, 'Enter the secret code'),

                        message && e('div', { className: `message ${message.includes('✅') ? 'message-success' : 'message-error'}` }, message),

                        e('input', {
                            type: 'text',
                            value: accessCode,
                            onChange: (evt) => setAccessCode(evt.target.value),
                            placeholder: 'Enter secret code',
                            className: 'w-full p-4 mb-6'
                        }),

                        e('button', {
                            onClick: async () => {
                                if (!accessCode.trim()) {
                                    setMessage('❌ Enter a code');
                                    return;
                                }

                                setLoading(true);
                                try {
                                    const response = await fetch(`${API_URL}/drops/resolve`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ code: accessCode })
                                    });

                                    if (!response.ok) {
                                        const error = await response.json();
                                        const errorCode = error.error?.code;
                                        let errorMsg = '❌ Drop not found';

                                        if (errorCode === 'DROP_EXPIRED') errorMsg = '❌ Drop expired';
                                        else if (errorCode === 'DROP_DELETED') errorMsg = '❌ Drop was deleted';

                                        throw new Error(errorMsg);
                                    }

                                    const drop = await response.json();
                                    setAccessedDrop(drop);
                                    setMessage('✅ Access granted!');
                                    setTimeout(() => setView('files'), 800);
                                } catch (err) {
                                    setMessage(err.message || '❌ Invalid code');
                                } finally {
                                    setLoading(false);
                                }
                            },
                            disabled: loading,
                            className: 'btn btn-success w-full'
                        }, loading ? e('span', {}, e('span', { className: 'spinner' }), ' Checking...') : 'Access Drop')
                    )
                )
            );

            // CREATE DROP - Simplified
            const renderCreate = () => {
                const handleFileSelect = (fileList) => {
                    const newFiles = Array.from(fileList).map(file => ({
                        file,
                        id: Math.random(),
                        name: file.name,
                        size: (file.size / 1024 / 1024).toFixed(2),
                        type: file.type
                    }));
                    setFiles([...files, ...newFiles]);
                };

                const handleCreateDrop = async () => {
                    setLoading(true);
                    setUploadProgress(0);

                    try {
                        const dropResponse = await fetch(`${API_URL}/drops`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                text: text.trim() || undefined,
                                code: userCode,
                                expiry: expiresIn
                            })
                        });

                        if (!dropResponse.ok) {
                            const error = await dropResponse.json();
                            throw new Error(error.error?.message || 'Failed to create drop');
                        }

                        const drop = await dropResponse.json();

                        if (files.length > 0) {
                            for (let i = 0; i < files.length; i++) {
                                const formData = new FormData();
                                formData.append('file', files[i].file);

                                await fetch(`${API_URL}/drops/${drop.id}/files`, {
                                    method: 'POST',
                                    body: formData
                                });

                                setUploadProgress(Math.round((i + 1) / files.length * 100));
                            }
                        }

                        setFiles([]);
                        setText('');
                        setView('created');
                    } catch (err) {
                        setMessage(`❌ ${err.message}`);
                    } finally {
                        setLoading(false);
                    }
                };

                return e('div', { className: 'main-content' },
                    e('div', { className: 'animated-bg' },
                        e('div', { className: 'blob blob1' }),
                        e('div', { className: 'blob blob2' }),
                        e('div', { className: 'blob blob3' })
                    ),
                    e('div', { className: 'container-max fade-in' },
                        e('a', { className: 'back-btn', onClick: () => setView('home') }, '← Back Home'),
                        e('div', { className: 'card' },
                            e('h2', { className: 'text-3xl font-bold mb-2' }, '📤 Create Drop'),
                            e('p', { className: 'text-white/60 mb-8' }, 'Share files, text, or both'),

                            e('div', { className: 'bg-white/5 border border-white/20 rounded-16 p-6 mb-8' },
                                e('p', { className: 'text-white/60 mb-2' }, 'Your Code:'),
                                e('code', { className: 'text-3xl font-bold text-blue-300' }, userCode)
                            ),

                            message && e('div', { className: `message ${message.includes('✅') ? 'message-success' : 'message-error'}` }, message),

                            uploadProgress > 0 && uploadProgress < 100 && e('div', { className: 'mb-6' },
                                e('p', { className: 'text-white/70 mb-2' }, `Uploading: ${uploadProgress}%`),
                                e('div', { className: 'progress' },
                                    e('div', { className: 'progress-bar', style: { width: uploadProgress + '%' } })
                                )
                            ),

                            e('div', { className: 'mb-8' },
                                e('label', { className: 'block text-white/80 font-semibold mb-4' }, '📁 Upload Files (optional)'),
                                e('div', {
                                    className: `upload-zone ${dragOver ? 'dragover' : ''}`,
                                    onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
                                    onDragLeave: () => setDragOver(false),
                                    onDrop: (e) => { e.preventDefault(); setDragOver(false); handleFileSelect(e.dataTransfer.files); },
                                    onClick: () => fileInputRef.current?.click()
                                },
                                    e('div', { className: 'text-4xl mb-3' }, '⬆️'),
                                    e('p', { className: 'text-white/80 font-semibold mb-2' }, 'Drag & Drop or Click'),
                                    e('p', { className: 'text-white/50' }, 'Images, videos, PDFs, documents...'),
                                    e('input', {
                                        ref: fileInputRef,
                                        type: 'file',
                                        multiple: true,
                                        onChange: (evt) => handleFileSelect(evt.target.files),
                                        className: 'hidden',
                                        accept: '*/*'
                                    })
                                ),

                                files.length > 0 && e('div', { className: 'mt-4' },
                                    e('p', { className: 'text-white/70 mb-3' }, `✅ ${files.length} file(s) selected`),
                                    files.map((f) => e('div', {
                                        key: f.id,
                                        className: 'file-item'
                                    },
                                        e('span', {}, `📄 ${f.name} (${f.size} MB)`),
                                        e('button', {
                                            onClick: () => setFiles(files.filter(x => x.id !== f.id)),
                                            className: 'text-red-400 hover:text-red-300'
                                        }, '✕')
                                    ))
                                )
                            ),

                            e('div', { className: 'mb-8' },
                                e('label', { className: 'block text-white/80 font-semibold mb-4' }, '💬 Add Message (optional)'),
                                e('textarea', {
                                    value: text,
                                    onChange: (evt) => setText(evt.target.value),
                                    placeholder: 'Type message or leave empty...',
                                    className: 'w-full p-4',
                                    rows: 4
                                })
                            ),

                            e('div', { className: 'mb-8' },
                                e('label', { className: 'block text-white/80 font-semibold mb-4' }, '⏰ Expires in'),
                                e('select', {
                                    value: expiresIn,
                                    onChange: (evt) => setExpiresIn(evt.target.value),
                                    className: 'w-full p-4'
                                },
                                    e('option', { value: '3600' }, '1 Hour'),
                                    e('option', { value: '86400' }, '1 Day'),
                                    e('option', { value: '604800' }, '1 Week'),
                                    e('option', { value: '2592000' }, '30 Days')
                                )
                            ),

                            e('button', {
                                onClick: handleCreateDrop,
                                disabled: loading,
                                className: 'btn btn-primary w-full text-lg'
                            }, loading ? '⏳ Creating...' : '🚀 Create Drop')
                        )
                    )
                );
            };

            // FILES VIEW
            const renderFiles = () => {
                if (!accessedDrop) return null;

                return e('div', { className: 'main-content' },
                    e('div', { className: 'animated-bg' },
                        e('div', { className: 'blob blob1' }),
                        e('div', { className: 'blob blob2' }),
                        e('div', { className: 'blob blob3' })
                    ),
                    e('div', { className: 'container-max fade-in' },
                        e('a', { className: 'back-btn', onClick: () => setView('home') }, '← Back Home'),
                        e('div', { className: 'card' },
                            e('h2', { className: 'text-3xl font-bold mb-8' }, '📥 Drop Contents'),

                            accessedDrop.text && e('div', {
                                className: 'bg-gradient-to-r from-blue-500/20 to-purple-500/20 border border-blue-500/50 rounded-lg p-6 mb-8'
                            },
                                e('p', { className: 'text-white/90 whitespace-pre-wrap' }, accessedDrop.text)
                            ),

                            accessedDrop.files && accessedDrop.files.length > 0 && e('div', { className: 'mb-8' },
                                e('h3', { className: 'text-xl font-bold mb-4' }, `📁 Files (${accessedDrop.files.length})`),
                                accessedDrop.files.map((file, idx) => e('div', {
                                    key: idx,
                                    className: 'bg-white/5 border border-white/20 rounded-lg p-6 mb-4'
                                },
                                    file.type.startsWith('image/') && e('img', {
                                        src: `${API_URL}/drops/${accessedDrop.id}/files/${file.id}/download?code=${accessCode}`,
                                        className: 'w-full max-h-96 object-cover rounded mb-4'
                                    }),

                                    e('div', { className: 'flex justify-between items-center' },
                                        e('div', {},
                                            e('p', { className: 'font-bold' }, file.name),
                                            e('p', { className: 'text-white/50 text-sm' }, `${(file.size / 1024 / 1024).toFixed(2)} MB`)
                                        ),
                                        e('a', {
                                            href: `${API_URL}/drops/${accessedDrop.id}/files/${file.id}/download?code=${accessCode}`,
                                            download: file.name,
                                            className: 'btn btn-success px-6 py-2'
                                        }, '⬇️ Download')
                                    )
                                ))
                            )
                        )
                    )
                );
            };

            // SUCCESS
            const renderCreated = () => e('div', { className: 'main-content' },
                e('div', { className: 'animated-bg' },
                    e('div', { className: 'blob blob1' }),
                    e('div', { className: 'blob blob2' }),
                    e('div', { className: 'blob blob3' })
                ),
                e('div', { className: 'container-max fade-in' },
                    e('div', { className: 'card max-w-md mx-auto text-center success-animation' },
                        e('div', { className: 'icon text-6xl' }, '🎉'),
                        e('h2', { className: 'text-4xl font-bold mb-4' }, 'Drop Created!'),
                        e('p', { className: 'text-white/60 mb-8' }, 'Share this code:'),

                        e('div', { className: 'bg-gradient-to-r from-purple-500/30 to-pink-500/30 border border-purple-500/50 rounded-lg p-6 mb-8' },
                            e('code', { className: 'text-3xl font-bold text-green-300' }, userCode)
                        ),

                        e('button', {
                            onClick: () => { navigator.clipboard.writeText(userCode); setMessage('✅ Copied!'); },
                            className: 'btn btn-primary w-full mb-3'
                        }, '📋 Copy Code'),

                        e('button', {
                            onClick: () => { setView('home'); setUserCode(''); setFiles([]); setText(''); setMessage(''); },
                            className: 'btn w-full bg-white/10 hover:bg-white/20 text-white'
                        }, 'New Drop')
                    )
                )
            );

            return e('div', {},
                view === 'home' && renderHome(),
                view === 'setcode' && renderSetCode(),
                view === 'create' && renderCreate(),
                view === 'access' && renderAccess(),
                view === 'files' && renderFiles(),
                view === 'created' && renderCreated()
            );
        }

        ReactDOM.render(e(App), document.getElementById('root'));
    </script>
</body>
</html>
